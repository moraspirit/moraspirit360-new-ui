name: Deploy MoraSpirit360

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy source
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "."
          target: /opt/msp/moraspirit360-new-ui
          rm: true

      - name: Build and restart app
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INTERNAL_GATEWAY_KEY: ${{ secrets.INTERNAL_GATEWAY_KEY }}
          RUN_PRISMA_MIGRATIONS: ${{ secrets.RUN_PRISMA_MIGRATIONS }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: DATABASE_URL,INTERNAL_GATEWAY_KEY,RUN_PRISMA_MIGRATIONS
          script: |
            set -e
            mkdir -p /opt/msp/moraspirit360-new-ui
            cd /opt/msp/moraspirit360-new-ui

            # App env for docker compose
            cat > /opt/msp/moraspirit360-new-ui/.env <<ENVEOF
            DATABASE_URL=${DATABASE_URL}
            INTERNAL_GATEWAY_KEY=${INTERNAL_GATEWAY_KEY}
            RUN_PRISMA_MIGRATIONS=${RUN_PRISMA_MIGRATIONS:-false}
            ENVEOF
            chmod 600 /opt/msp/moraspirit360-new-ui/.env

            # Production compose file
            cat > /opt/msp/moraspirit360-new-ui/docker-compose.prod.yml <<'YAML'
            services:
              moraspirit360-ui:
                build:
                  context: /opt/msp/moraspirit360-new-ui
                  dockerfile: Dockerfile
                image: moraspirit360-ui:prod
                container_name: moraspirit360-ui
                restart: unless-stopped
                env_file:
                  - /opt/msp/moraspirit360-new-ui/.env
                ports:
                  - "3008:3000"
            YAML

            # Nginx site config (public site + protected admin API path)
            cat > /etc/nginx/sites-available/msp360.conf <<'NGINX'
            server {
                listen 80;
                server_name moraspirit360.com www.moraspirit360.com;
                client_max_body_size 20M;

                location / {
                    proxy_pass http://127.0.0.1:3008;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_read_timeout 90s;
                    proxy_send_timeout 90s;
                }

                # Block direct internet access to admin APIs.
                # Gateway should call container directly via localhost/internal URL.
                location ^~ /api/admin/ {
                    return 403;
                }
            }
            NGINX

            ln -sf /etc/nginx/sites-available/msp360.conf /etc/nginx/sites-enabled/msp360.conf
            nginx -t && systemctl reload nginx

            # Ensure/refresh SSL cert
            certbot --nginx -d moraspirit360.com -d www.moraspirit360.com --non-interactive --reinstall || true

            # Rebuild and restart only this app
            docker compose -f /opt/msp/moraspirit360-new-ui/docker-compose.prod.yml down --remove-orphans || true
            docker compose -f /opt/msp/moraspirit360-new-ui/docker-compose.prod.yml build --pull
            docker compose -f /opt/msp/moraspirit360-new-ui/docker-compose.prod.yml up -d

            sleep 5
            docker compose -f /opt/msp/moraspirit360-new-ui/docker-compose.prod.yml ps
            docker image prune -f
